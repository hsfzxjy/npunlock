[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npunlock"
dynamic = ["version"]
description = "Symbolic Python frontend for the npunlock ACT-SHAVE toolchain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
npunlock-viz = "npunlock.viz.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
npunlock = ["py.typed", "*.pyi", "include/npunlock/*.h"]
"npunlock._bin" = ["*.dll", "*.exe"]
"npunlock.viz" = ["static/*.html", "static/*.css", "static/*.js", "schemas/*.json"]

[tool.black]
line-length = 120
target-version = ["py310"]
