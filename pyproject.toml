[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npunlock"
version = "0.1.0"
description = "Symbolic Python frontend for the npunlock ACT-SHAVE toolchain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
npunlock = ["py.typed", "*.pyi"]
