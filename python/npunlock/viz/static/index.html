<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artifact viewer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <main id="app" aria-label="Binary artifact workspace">
      <header class="toolbar">
        <nav id="history-controls" class="button-group" aria-label="Navigation history">
          <button id="back" type="button" title="Back (Alt+Left)" aria-label="Back">‹</button>
          <button id="forward" type="button" title="Forward (Alt+Right)" aria-label="Forward">›</button>
        </nav>
        <nav id="artifact-tabs" class="artifact-tabs" role="tablist" aria-label="Artifacts"></nav>
        <form id="offset-form" class="offset-form" autocomplete="off">
          <label for="offset-input">offset</label>
          <input id="offset-input" inputmode="text" spellcheck="false" aria-label="File offset">
        </form>
        <button id="copy" type="button" title="Copy current location">copy</button>
        <button id="toggle-dim-irrelevant" type="button" title="Dim bytes and fields explicitly marked irrelevant" aria-pressed="true">dim irrelevant</button>
        <button id="toggle-tree" type="button" title="Show or hide structure" aria-pressed="true">structure</button>
        <button id="toggle-inspector" type="button" title="Show or hide inspector" aria-pressed="true">inspector</button>
      </header>
      <section id="workspace" class="workspace">
        <aside id="tree-panel" class="panel tree-panel" aria-label="Structure">
          <div id="tree" class="tree" role="tree"></div>
        </aside>
        <div id="left-splitter" class="splitter" role="separator" aria-label="Resize structure panel" aria-orientation="vertical" tabindex="0"></div>
        <section id="hex-panel" class="hex-panel" aria-label="Hex bytes">
          <div id="hex-head" class="hex-head-viewport" aria-hidden="true">
            <div class="hex-head">
              <span class="offset-head">file offset</span>
              <span class="hex-labels">
                <span class="hex-label">00</span><span class="hex-label">01</span><span class="hex-label">02</span><span class="hex-label">03</span>
                <span class="hex-label">04</span><span class="hex-label">05</span><span class="hex-label">06</span><span class="hex-label">07</span>
                <span class="hex-label">08</span><span class="hex-label">09</span><span class="hex-label">0a</span><span class="hex-label">0b</span>
                <span class="hex-label">0c</span><span class="hex-label">0d</span><span class="hex-label">0e</span><span class="hex-label">0f</span>
              </span>
              <span class="ascii-labels">
                <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
                <span>8</span><span>9</span><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span>
              </span>
            </div>
          </div>
          <div id="hex-scroll" class="hex-scroll" tabindex="0" aria-label="Virtualized hex data">
            <div id="hex-space" class="hex-space"></div>
            <div id="hex-rows" class="hex-rows"></div>
          </div>
          <div id="status" class="status" role="status"></div>
        </section>
        <div id="right-splitter" class="splitter" role="separator" aria-label="Resize inspector panel" aria-orientation="vertical" tabindex="0"></div>
        <aside id="inspector-panel" class="panel inspector-panel" aria-label="Inspector">
          <div id="inspector" class="inspector"></div>
        </aside>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
