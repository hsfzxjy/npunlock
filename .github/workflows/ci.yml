name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package
        run: python -m pip install --disable-pip-version-check .

      - name: Configure static build
        shell: pwsh
        run: >-
          tools\msvc-run.ps1 cmake -S . -B build\ci-static -G "NMake Makefiles"
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF
          -DNPUNLOCK_BUILD_TESTS=ON -DNPUNLOCK_ENABLE_NPU_TESTS=OFF
          -DNPUNLOCK_ENABLE_MOVITOOLS_TESTS=OFF
          -DNPUNLOCK_ENABLE_PATCHBLOB_TESTS=OFF
          -DNPUNLOCK_ENABLE_GRAPHINFER_TESTS=OFF

      - name: Build and test static configuration
        shell: pwsh
        run: |
          tools\msvc-run.ps1 cmake --build build\ci-static
          tools\msvc-run.ps1 ctest --test-dir build\ci-static --output-on-failure
          tools\msvc-run.ps1 cmake --build build\ci-static --target format-check

      - name: Verify installed CMake package
        shell: pwsh
        run: |
          tools\msvc-run.ps1 cmake --install build\ci-static --prefix build\ci-stage
          tools\msvc-run.ps1 cmake -S tests\package -B build\ci-package -G "NMake Makefiles" -DCMAKE_PREFIX_PATH="$PWD\build\ci-stage"
          tools\msvc-run.ps1 cmake --build build\ci-package
          build\ci-package\npunlock_package_smoke.exe

      - name: Configure shared build
        shell: pwsh
        run: >-
          tools\msvc-run.ps1 cmake -S . -B build\ci-shared -G "NMake Makefiles"
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=ON
          -DNPUNLOCK_BUILD_TESTS=ON -DNPUNLOCK_ENABLE_NPU_TESTS=OFF
          -DNPUNLOCK_ENABLE_MOVITOOLS_TESTS=OFF
          -DNPUNLOCK_ENABLE_PATCHBLOB_TESTS=OFF
          -DNPUNLOCK_ENABLE_GRAPHINFER_TESTS=OFF

      - name: Build and test shared configuration
        shell: pwsh
        run: |
          tools\msvc-run.ps1 cmake --build build\ci-shared
          tools\msvc-run.ps1 ctest --test-dir build\ci-shared --output-on-failure

      - name: Build Python wheel
        run: python -m pip wheel . --no-deps --wheel-dir build\python-dist
