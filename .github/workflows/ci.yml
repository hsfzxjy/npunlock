name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Configure offline build
        shell: pwsh
        run: >-
          tools\msvc-run.ps1 cmake -S . -B build\ci -G "NMake Makefiles"
          -DCMAKE_BUILD_TYPE=Debug
          -DNPUNLOCK_BUILD_TESTS=ON -DNPUNLOCK_ENABLE_NPU_TESTS=OFF
          -DNPUNLOCK_ENABLE_MOVITOOLS_TESTS=OFF
          -DNPUNLOCK_ENABLE_PATCHBLOB_TESTS=OFF
          -DNPUNLOCK_ENABLE_GRAPHINFER_TESTS=OFF

      - name: Build and test offline configuration
        shell: pwsh
        run: |
          tools\msvc-run.ps1 cmake --build build\ci
          tools\msvc-run.ps1 ctest --test-dir build\ci --output-on-failure
          tools\msvc-run.ps1 cmake --build build\ci --target format-check

      - name: Verify installed CMake package
        shell: pwsh
        run: |
          tools\msvc-run.ps1 cmake --install build\ci --prefix build\ci-stage
          tools\msvc-run.ps1 cmake -S tests\package -B build\ci-package -G "NMake Makefiles" -DCMAKE_PREFIX_PATH="$PWD\build\ci-stage"
          tools\msvc-run.ps1 cmake --build build\ci-package
          $env:Path = "$PWD\build\ci-stage\bin;$env:Path"
          .\build\ci-package\npunlock_package_smoke.exe

      - name: Build Python wheel
        run: python -m pip wheel . --no-deps --wheel-dir build\python-dist

      - name: Verify bundled Python runtime
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem build\python-dist\npunlock-*.whl | Select-Object -First 1).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          python -c "from npunlock._native import NativeLibraries; NativeLibraries(); print('bundled runtime loaded')"
